name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  checks:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEBUG: "True"
      GITLEAKS_VERSION: "8.30.1"

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1 pinned to a full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0 pinned to a full commit SHA.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-deploy.txt
            constraints.txt

      - name: Set up Node.js
        # actions/setup-node v7.0.0 pinned to a full commit SHA.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Secret scan
        run: |
          # Scan only git-tracked files (skips .venv, node_modules, etc.).
          scan_dir="$(mktemp -d)"
          git ls-files -z | rsync --files-from=- --from0 -a ./ "$scan_dir"/
          gitleaks dir "$scan_dir" --config .gitleaks.toml --redact --verbose

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -r requirements-deploy.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Ruff
        run: ruff check .

      - name: Import contracts
        run: lint-imports

      - name: Security patterns
        run: python3 tools/check_security_patterns.py

      - name: Semgrep SAST
        run: |
          semgrep scan \
            --config p/ci \
            --error \
            --metrics=off \
            config web static/web/ts tools ops .github

      - name: Python dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Node dependency audit
        run: npm audit --audit-level=moderate

      - name: Memory system
        run: python3 tools/check_memory_system.py

      - name: Agent control
        run: |
          python3 -m json.tool agent-control.json >/dev/null
          python3 -m json.tool .codex/hooks.json >/dev/null
          python3 tools/agent_control.py doctor
          python3 tools/agent_control.py self-test
          python3 -m unittest \
            tools.test_agent_control \
            tools.test_dependabot_maintenance \
            tools.test_project_knowledge

      - name: Deployment configuration
        run: |
          bash -n deploy.sh
          ansible-playbook --syntax-check -i localhost, ops/ansible/deploy.yml
          ansible-playbook --syntax-check -i localhost, ops/ansible/host-maintenance.yml

      - name: Django tests
        run: python3 manage.py test web

      - name: TypeScript
        run: npm run typecheck

      - name: Build JavaScript assets
        run: npm run build:js

      - name: Generated assets are current
        run: git diff --exit-code -- static/web/js
